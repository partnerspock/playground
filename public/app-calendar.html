<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000" media="(max-width: 640px)">
    <meta name="theme-color" content="#1d1d1d">
    <title>Calendar</title>
    <script src="https://kit.fontawesome.com/c66aa74d08.js" crossorigin="anonymous"></script>
    <style>
        :root {
            /* ===== WARNA PER APP ===== */
            --accent: #5b53f5;
            --accent-2: #5b53f5;
            --accent-hover: rgba(91, 83, 245, 0.4);

            --pad-l: 40px;
            --pad-r: 40px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #1d1d1d;
            color: #ffffff;
            font-family: 'Segoe UI', 'Segoe WP', 'Selawik', 'Open Sans', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* ===== APP BAR ATAS ===== */
        .app-bar {
            background-color: var(--accent);
            height: 55px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            flex-shrink: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .app-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }

        .app-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .app-bar-right .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        /* ===== PIVOT HEADER ===== */
        .app-headers {
            width: 100%;
            padding: 20px 40px 0 40px;
            flex-shrink: 0;
            background-color: #1d1d1d;
            z-index: 99;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .app-headers::-webkit-scrollbar {
            display: none;
        }

        .pivot-track {
            position: relative;
            display: flex;
            gap: 40px;
            min-width: max-content;
        }

        .header-item {
            font-size: 28px;
            font-weight: 300;
            color: #7a7a7a;
            cursor: pointer;
            padding-bottom: 10px;
            border-bottom: 4px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-item.active {
            color: #ffffff;
            font-weight: 400;
            border-bottom: 4px solid var(--accent);
        }

        /* ===== KONTEN ===== */
        /* Desktop: kalender memenuhi tinggi layar, tidak scroll */
        .app-content {
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            padding: 10px 40px 30px 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .content-section {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            width: 100%;
            height: 100%;
        }

        .content-section.active {
            display: flex;
        }

        .calendar-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .calendar-title-display {
            font-size: 22px;
            font-weight: 300;
            color: var(--accent);
            min-width: 0;
        }

        .cal-nav-btns {
            display: flex;
            gap: 8px;
        }

        .cal-btn {
            background: #2d2d2d;
            border: 2px solid transparent;
            color: white;
            padding: 5px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s;
        }

        .cal-btn:active {
            background: #3d3d3d;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ---------- MONTHLY ---------- */
        .month-view-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
        }

        .calendar-grid-month-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            flex-shrink: 0;
        }

        .cal-day-name {
            text-align: center;
            font-weight: 400;
            color: #888;
            font-size: 13px;
            padding-bottom: 6px;
        }

        .calendar-grid-month {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
            gap: 6px;
            flex-grow: 1;
            min-height: 0;
            margin-top: 4px;
        }

        .cal-cell {
            background-color: #262626;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            height: 100%;
            min-height: 0;
            cursor: pointer;
        }

        .cal-cell.empty {
            background-color: transparent;
            cursor: default;
            border: none;
        }

        .cal-cell.today {
            background-color: var(--accent);
            color: #ffffff;
            border-color: #ffffff;
        }

        .cal-cell.selected:not(.today) {
            border-color: var(--accent);
        }

        .date-num {
            font-size: 16px;
            font-weight: 300;
        }

        .date-event {
            font-size: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .today .date-event {
            background: rgba(0, 0, 0, 0.15);
        }

        .event-dot {
            display: none;
        }

        .day-detail {
            display: none;
        }

        /* ---------- WEEKLY ---------- */
        .calendar-grid-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            flex-grow: 1;
            min-height: 0;
        }

        .week-column {
            background-color: #262626;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: background 0.2s, border-color 0.2s;
            height: 100%;
        }

        .week-column.today {
            background-color: var(--accent);
            color: #ffffff;
            border-color: #ffffff;
        }

        .week-col-header {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .week-column.today .week-col-header {
            color: rgba(255, 255, 255, 0.8);
        }

        .week-col-date {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .week-events-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .week-event-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 10px;
            font-size: 11px;
            border-left: 3px solid #ffffff;
        }

        /* ---------- YEARLY ---------- */
        .calendar-grid-year {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            flex-grow: 1;
            min-height: 0;
        }

        .mini-month-card {
            background-color: #262626;
            padding: 10px 12px;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
            height: 100%;
            cursor: pointer;
        }

        .mini-month-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .mini-days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            flex-grow: 1;
        }

        .mini-day {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }

        .mini-day.header {
            color: #666;
            font-weight: bold;
        }

        .mini-day.today {
            background-color: var(--accent);
            color: #fff;
            font-weight: bold;
        }

        .cal-cell:not(.empty):active,
        .mini-month-card:active {
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Hover hanya untuk perangkat yang punya mouse */
        @media (hover: hover) {
            .app-bar-right .close-btn:hover {
                background-color: rgba(255, 255, 255, 0.2);
            }

            .header-item:hover {
                color: #cccccc;
                border-bottom-color: var(--accent-hover);
            }

            .header-item.active:hover {
                color: #ffffff;
                border-bottom-color: var(--accent);
            }

            .cal-btn:hover {
                background: #3d3d3d;
                border-color: rgba(255, 255, 255, 0.3);
            }

            .cal-cell:not(.empty):hover {
                background-color: #333333;
                border-color: rgba(255, 255, 255, 0.3);
            }

            .cal-cell.today:hover {
                background-color: var(--accent);
                border-color: #ffffff;
            }

            .week-column:not(.today):hover {
                background-color: #2f2f2f;
                border-color: rgba(255, 255, 255, 0.2);
            }

            .mini-month-card:hover {
                border-color: rgba(255, 255, 255, 0.3);
            }
        }

        /* ===== ELEMEN KHUSUS MOBILE (disembunyikan di desktop) ===== */
        .app-appbar {
            display: none;
        }

        /* ===================================================
           MOBILE (<= 640px)  gaya Windows Phone 8.1 Pivot
           =================================================== */
        @media (max-width: 640px) {
            :root {
                --pad-l: calc(19px + env(safe-area-inset-left, 0px));
                --pad-r: calc(19px + env(safe-area-inset-right, 0px));
            }

            html,
            body {
                background-color: #000;
            }

            .app-bar {
                height: auto;
                min-height: 0;
                background: #000;
                border-bottom: 0;
                justify-content: flex-start;
                padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--pad-r) 0 var(--pad-l);
            }

            .app-icon,
            .app-bar-right {
                display: none;
            }

            .app-title {
                font-size: 18px;
                font-weight: 600;
                letter-spacing: 0.3px;
            }

            .app-headers {
                background: #000;
                border-bottom: 0;
                padding: 4px 0 0 var(--pad-l);
                overflow: hidden;
                touch-action: pan-y;
            }

            .pivot-track {
                gap: 24px;
                transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
                will-change: transform;
            }

            .header-item {
                font-size: clamp(30px, 9.5vw, 42px);
                font-weight: 300;
                line-height: 1.15;
                padding-bottom: 6px;
                border-bottom: 0;
                color: rgba(255, 255, 255, 0.4);
                transition: color 0.25s;
                max-width: calc(100vw - var(--pad-l) - var(--pad-r));
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .header-item.active {
                font-weight: 300;
                color: #fff;
                border-bottom: 0;
            }

            /* Konten boleh scroll vertikal di mobile */
            .app-content {
                padding: 14px var(--pad-r) 28px var(--pad-l);
                overflow-y: auto;
                overflow-x: hidden;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                touch-action: pan-y;
            }

            .app-content::-webkit-scrollbar {
                display: none;
            }

            .content-section {
                height: auto;
                flex-grow: 0;
                min-height: 0;
            }

            /* Kontrol: judul di atas, tombol selebar layar */
            .calendar-header-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-bottom: 14px;
            }

            .calendar-title-display {
                font-size: 18px;
            }

            .cal-nav-btns {
                width: 100%;
            }

            .cal-btn {
                flex: 1;
                min-height: 44px;
                font-size: 14px;
            }

            /* Monthly: sel persegi, acara jadi titik */
            .month-view-wrapper {
                flex-grow: 0;
            }

            .calendar-grid-month-header {
                gap: 4px;
            }

            .cal-day-name {
                font-size: 11px;
                padding-bottom: 4px;
            }

            .calendar-grid-month {
                grid-auto-rows: auto;
                gap: 4px;
                flex-grow: 0;
            }

            .cal-cell {
                aspect-ratio: 1 / 1;
                height: auto;
                padding: 4px;
                align-items: center;
                justify-content: center;
                gap: 4px;
            }

            .cal-cell.empty {
                aspect-ratio: 1 / 1;
            }

            .date-num {
                font-size: 15px;
            }

            .date-event {
                display: none;
            }

            .event-dot {
                display: block;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
            }

            .cal-cell.today .event-dot {
                background: #ffffff;
            }

            .day-detail {
                display: block;
                margin-top: 16px;
                padding: 14px 16px;
                background: #1f1f1f;
                border-left: 4px solid var(--accent);
            }

            .day-detail-date {
                font-size: 15px;
                font-weight: 400;
                color: #ffffff;
                margin-bottom: 6px;
            }

            .day-detail-body {
                font-size: 13px;
                font-weight: 300;
                color: #aaaaaa;
                line-height: 1.5;
            }

            /* Weekly: 7 baris */
            .calendar-grid-week {
                grid-template-columns: 1fr;
                gap: 8px;
                flex-grow: 0;
            }

            .week-column {
                flex-direction: row;
                align-items: center;
                gap: 16px;
                padding: 12px 14px;
                min-height: 64px;
                height: auto;
            }

            .week-col-head {
                width: 56px;
                flex-shrink: 0;
                text-align: center;
            }

            .week-col-header {
                margin-bottom: 0;
                font-size: 12px;
            }

            .week-col-date {
                font-size: 26px;
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
            }

            .week-events-list {
                min-width: 0;
                justify-content: center;
            }

            .week-event-card {
                font-size: 13px;
                padding: 8px 10px;
            }

            /* Yearly: 2 kolom, scroll */
            .calendar-grid-year {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: none;
                grid-auto-rows: auto;
                gap: 10px;
                flex-grow: 0;
            }

            .mini-month-card {
                padding: 10px 12px 12px;
                height: auto;
            }

            .mini-month-title {
                font-size: 15px;
                margin-bottom: 6px;
            }

            .mini-days-grid {
                font-size: 10px;
                gap: 3px;
            }

            .mini-day {
                min-height: 16px;
            }

            /* App bar bawah ala WP */
            .app-appbar {
                display: flex;
                flex-shrink: 0;
                align-items: center;
                justify-content: center;
                background: #1f1f1f;
                height: calc(62px + env(safe-area-inset-bottom, 0px));
                padding: 0 var(--pad-r) env(safe-area-inset-bottom, 0px) var(--pad-l);
                z-index: 100;
            }

            .appbar-btn {
                background: none;
                border: 0;
                color: #fff;
                font-family: inherit;
                height: 100%;
                padding: 0 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                cursor: pointer;
            }

            .appbar-btn .circle {
                width: 36px;
                height: 36px;
                border: 2px solid #fff;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 15px;
                transition: background 0.1s, color 0.1s;
            }

            .appbar-btn .lbl {
                font-size: 11px;
                line-height: 1;
                text-transform: lowercase;
            }

            .appbar-btn:active .circle {
                background: #fff;
                color: #1f1f1f;
            }

            /* Animasi masuk */
            .content-section.active>* {
                animation: wpIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) both;
            }

            .content-section.active>*:nth-child(2) {
                animation-delay: 50ms;
            }

            .content-section.active>*:nth-child(3) {
                animation-delay: 100ms;
            }

            .app-headers {
                animation: wpIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) both;
            }

            /* Animasi keluar saat kembali ke Start */
            body.leaving .app-content,
            body.leaving .app-headers {
                animation: wpOut 0.2s cubic-bezier(0.5, 0, 1, 0.5) forwards;
            }
        }

        @keyframes wpIn {
            from {
                opacity: 0;
                transform: translateX(var(--from, 48px));
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes wpOut {
            to {
                opacity: 0;
                transform: translateX(48px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <header class="app-bar">
        <div class="app-bar-left">
            <div class="app-icon"><i class="fa-solid fa-calendar"></i></div>
            <span class="app-title">Calendar</span>
        </div>
        <div class="app-bar-right">
            <button class="close-btn" onclick="backToStartMenu()" title="Back to Start Menu">✕</button>
        </div>
    </header>

    <!-- Header tab dibuat otomatis oleh script dari daftar ini -->
    <nav class="app-headers">
        <div class="pivot-track" id="pivotTrack">
            <div class="header-item">Weekly</div>
            <div class="header-item">Monthly</div>
            <div class="header-item">Yearly</div>
        </div>
    </nav>

    <main class="app-content">
        <!-- Tab 0: Weekly -->
        <section class="content-section" id="section-0">
            <div class="calendar-header-controls">
                <div class="calendar-title-display" id="weekRangeDisplay">Week of October 11 - 17, 2026</div>
                <div class="cal-nav-btns">
                    <button class="cal-btn" onclick="changeWeek(-1)">‹ Prev</button>
                    <button class="cal-btn" onclick="goToCurrentWeek()">This Week</button>
                    <button class="cal-btn" onclick="changeWeek(1)">Next ›</button>
                </div>
            </div>
            <div class="calendar-grid-week" id="weeklyDaysGrid"></div>
        </section>

        <!-- Tab 1: Monthly -->
        <section class="content-section active" id="section-1">
            <div class="calendar-header-controls">
                <div class="calendar-title-display" id="monthYearDisplay">October 2026</div>
                <div class="cal-nav-btns">
                    <button class="cal-btn" onclick="changeMonth(-1)">‹ Prev</button>
                    <button class="cal-btn" onclick="goToCurrentMonth()">Today</button>
                    <button class="cal-btn" onclick="changeMonth(1)">Next ›</button>
                </div>
            </div>
            <div class="month-view-wrapper">
                <div class="calendar-grid-month-header">
                    <div class="cal-day-name">Sun</div>
                    <div class="cal-day-name">Mon</div>
                    <div class="cal-day-name">Tue</div>
                    <div class="cal-day-name">Wed</div>
                    <div class="cal-day-name">Thu</div>
                    <div class="cal-day-name">Fri</div>
                    <div class="cal-day-name">Sat</div>
                </div>
                <div class="calendar-grid-month" id="calendarDaysGrid"></div>
                <div class="day-detail" id="dayDetail" aria-live="polite"></div>
            </div>
        </section>

        <!-- Tab 2: Yearly -->
        <section class="content-section" id="section-2">
            <div class="calendar-header-controls">
                <div class="calendar-title-display" id="yearDisplay">2026</div>
                <div class="cal-nav-btns">
                    <button class="cal-btn" onclick="changeYear(-1)">‹ Prev</button>
                    <button class="cal-btn" onclick="goToCurrentYear()">This Year</button>
                    <button class="cal-btn" onclick="changeYear(1)">Next ›</button>
                </div>
            </div>
            <div class="calendar-grid-year" id="yearlyMonthsGrid"></div>
        </section>
    </main>

    <!-- App bar bawah (hanya tampil di mobile) -->
    <footer class="app-appbar">
        <button class="appbar-btn" type="button" onclick="backToStartMenu()" aria-label="Back to Start Menu">
            <span class="circle"><i class="fa-solid fa-arrow-left"></i></span>
            <span class="lbl">back</span>
        </button>
    </footer>

    <!-- LOGIKA KALENDER -->
    <script>
        let currentLiveDate = new Date();
        let selectedKey = null; // tanggal terpilih di Monthly (panel detail mobile)

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNamesShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        const eventsData = {
            "1999-03-16": "My 1st Day",
            "2026-06-30": "Farewell",
            "2026-10-28": ""
        };

        function esc(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function makeKey(y, m, d) {
            return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        }

        function isToday(y, m, d) {
            const t = new Date();
            return y === t.getFullYear() && m === t.getMonth() && d === t.getDate();
        }

        // Geser bulan/tahun tanpa "loncat" (31 Jan + 1 bulan => 28/29 Feb)
        function shiftMonths(date, delta) {
            const y = date.getFullYear();
            const m = date.getMonth() + delta;
            const lastDay = new Date(y, m + 1, 0).getDate();
            return new Date(y, m, Math.min(date.getDate(), lastDay));
        }

        // --- 1. MONTHLY ---
        function renderMonthlyView() {
            const year = currentLiveDate.getFullYear();
            const month = currentLiveDate.getMonth();

            document.getElementById('monthYearDisplay').innerText = monthNames[month] + ' ' + year;

            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'cal-cell empty';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                const dateKey = makeKey(year, month, day);
                cell.setAttribute('data-key', dateKey);

                if (isToday(year, month, day)) cell.classList.add('today');
                if (dateKey === selectedKey) cell.classList.add('selected');

                let html = '<span class="date-num">' + day + '</span>';
                if (eventsData[dateKey]) {
                    html += '<div class="date-event">' + esc(eventsData[dateKey]) + '</div>';
                    html += '<span class="event-dot"></span>';
                }
                cell.innerHTML = html;
                grid.appendChild(cell);
            }

            renderDayDetail();
        }

        function renderDayDetail() {
            const box = document.getElementById('dayDetail');
            if (!box) return;
            if (!selectedKey) {
                box.innerHTML = '<div class="day-detail-body">Tap a date to see details.</div>';
                return;
            }
            const p = selectedKey.split('-');
            const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
            const title = dayNamesShort[d.getDay()] + ', ' + monthNames[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
            const ev = eventsData[selectedKey];
            box.innerHTML =
                '<div class="day-detail-date">' + esc(title) + '</div>' +
                '<div class="day-detail-body">' + (ev ? esc(ev) : 'No events') + '</div>';
        }

        // Tap tanggal (event delegation)
        document.getElementById('calendarDaysGrid').addEventListener('click', function (e) {
            const cell = e.target.closest('.cal-cell');
            if (!cell || cell.classList.contains('empty')) return;
            selectedKey = cell.getAttribute('data-key');
            this.querySelectorAll('.cal-cell.selected').forEach(function (c) { c.classList.remove('selected'); });
            cell.classList.add('selected');
            renderDayDetail();
        });

        function changeMonth(direction) {
            currentLiveDate = shiftMonths(currentLiveDate, direction);
            selectedKey = null;
            renderAll();
        }

        function goToCurrentMonth() {
            currentLiveDate = new Date();
            selectedKey = null;
            renderAll();
        }

        // --- 2. WEEKLY ---
        function renderWeeklyView() {
            const grid = document.getElementById('weeklyDaysGrid');
            grid.innerHTML = '';

            const curr = new Date(currentLiveDate);
            const startOfWeek = new Date(curr);
            startOfWeek.setDate(curr.getDate() - curr.getDay());

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            let label;
            if (startOfWeek.getFullYear() !== endOfWeek.getFullYear()) {
                label = 'Week of ' + monthNames[startOfWeek.getMonth()] + ' ' + startOfWeek.getDate() + ', ' + startOfWeek.getFullYear() +
                    ' - ' + monthNames[endOfWeek.getMonth()] + ' ' + endOfWeek.getDate() + ', ' + endOfWeek.getFullYear();
            } else if (startOfWeek.getMonth() !== endOfWeek.getMonth()) {
                label = 'Week of ' + monthNames[startOfWeek.getMonth()] + ' ' + startOfWeek.getDate() +
                    ' - ' + monthNames[endOfWeek.getMonth()] + ' ' + endOfWeek.getDate() + ', ' + endOfWeek.getFullYear();
            } else {
                label = 'Week of ' + monthNames[startOfWeek.getMonth()] + ' ' + startOfWeek.getDate() +
                    ' - ' + endOfWeek.getDate() + ', ' + endOfWeek.getFullYear();
            }
            document.getElementById('weekRangeDisplay').innerText = label;

            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);

                const col = document.createElement('div');
                col.className = 'week-column';

                const year = d.getFullYear();
                const month = d.getMonth();
                const day = d.getDate();

                if (isToday(year, month, day)) col.classList.add('today');

                const dateKey = makeKey(year, month, day);
                let eventHtml = '';
                if (eventsData[dateKey]) {
                    eventHtml = '<div class="week-event-card"><strong>' + esc(eventsData[dateKey]) + '</strong><br><span style="font-size:9px; opacity:0.8;">All Day</span></div>';
                }

                col.innerHTML =
                    '<div class="week-col-head">' +
                    '<div class="week-col-header">' + dayNamesShort[i] + '</div>' +
                    '<div class="week-col-date">' + day + '</div>' +
                    '</div>' +
                    '<div class="week-events-list">' + eventHtml + '</div>';

                grid.appendChild(col);
            }
        }

        function changeWeek(direction) {
            const d = new Date(currentLiveDate);
            d.setDate(d.getDate() + direction * 7);
            currentLiveDate = d;
            selectedKey = null;
            renderAll();
        }

        function goToCurrentWeek() {
            currentLiveDate = new Date();
            selectedKey = null;
            renderAll();
        }

        // --- 3. YEARLY ---
        function renderYearlyView() {
            const year = currentLiveDate.getFullYear();
            document.getElementById('yearDisplay').innerText = year;

            const grid = document.getElementById('yearlyMonthsGrid');
            grid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                const card = document.createElement('div');
                card.className = 'mini-month-card';
                card.setAttribute('data-month', m);

                let daysGridHtml = '<div class="mini-day header">S</div><div class="mini-day header">M</div><div class="mini-day header">T</div><div class="mini-day header">W</div><div class="mini-day header">T</div><div class="mini-day header">F</div><div class="mini-day header">S</div>';

                const firstDayIndex = new Date(year, m, 1).getDay();
                const totalDays = new Date(year, m + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    daysGridHtml += '<div class="mini-day"></div>';
                }
                for (let d = 1; d <= totalDays; d++) {
                    const todayClass = isToday(year, m, d) ? ' today' : '';
                    daysGridHtml += '<div class="mini-day' + todayClass + '">' + d + '</div>';
                }

                card.innerHTML =
                    '<div class="mini-month-title">' + monthNames[m] + '</div>' +
                    '<div class="mini-days-grid">' + daysGridHtml + '</div>';

                grid.appendChild(card);
            }
        }

        // Tap kartu bulan => lompat ke tampilan Monthly bulan itu
        document.getElementById('yearlyMonthsGrid').addEventListener('click', function (e) {
            const card = e.target.closest('.mini-month-card');
            if (!card) return;
            const m = parseInt(card.getAttribute('data-month'), 10);
            currentLiveDate = new Date(currentLiveDate.getFullYear(), m, 1);
            selectedKey = null;
            renderAll();
            if (window.switchTab) window.switchTab(1);
        });

        function changeYear(direction) {
            currentLiveDate = shiftMonths(currentLiveDate, direction * 12);
            selectedKey = null;
            renderAll();
        }

        function goToCurrentYear() {
            currentLiveDate = new Date();
            selectedKey = null;
            renderAll();
        }

        // Render semua view supaya selalu sinkron
        function renderAll() {
            renderMonthlyView();
            renderWeeklyView();
            renderYearlyView();
        }

        renderAll();
    </script>

    <!-- PIVOT INFINITE + SWIPE + NAVIGASI -->
    <script>
        (function () {
            var mq = window.matchMedia('(max-width: 640px)');
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
            var leaving = false;

            var track = document.getElementById('pivotTrack');
            var headerBar = document.querySelector('.app-headers');
            var main = document.querySelector('.app-content');
            var sections = Array.prototype.slice.call(document.querySelectorAll('.content-section'));

            function mod(a, b) { return ((a % b) + b) % b; }

            /* PIVOT INFINITE
               p = posisi "virtual". Tab aktif = mod(p, n).
               Mobile: header digandakan 5 siklus, lalu dinormalkan
               diam-diam setelah animasi. Desktop: header biasa. */
            var labels = Array.prototype.map.call(track.children, function (c) {
                return c.textContent.trim();
            });
            var n = labels.length;
            var p = 0;
            for (var si = 0; si < sections.length; si++) {
                if (sections[si].classList.contains('active')) { p = si; break; }
            }
            var items = [];
            var infinite = false;
            var normTimer = null;

            function itemIndex(pos) { return infinite ? pos + n : pos; }

            function build() {
                infinite = mq.matches && n > 1;
                p = mod(p, n);
                track.innerHTML = '';
                items = [];
                var start = infinite ? -n : 0;
                var end = infinite ? 4 * n : n;
                for (var k = start; k < end; k++) {
                    var d = document.createElement('div');
                    d.className = 'header-item';
                    d.textContent = labels[mod(k, n)];
                    d.title = labels[mod(k, n)];
                    d.setAttribute('data-pos', k);
                    d.addEventListener('click', onHeaderClick);
                    track.appendChild(d);
                    items.push(d);
                }
                setActive();
                position(false);
            }

            function setActive() {
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.toggle('active', +items[i].getAttribute('data-pos') === p);
                }
            }

            function position(animate) {
                var it = items[itemIndex(p)];
                if (!it) return;
                if (!mq.matches) {
                    track.style.transition = '';
                    track.style.transform = '';
                    return;
                }
                track.style.transition = (animate && !reduce.matches) ? '' : 'none';
                track.style.transform = 'translateX(' + (-it.offsetLeft) + 'px)';
            }

            function normalize() {
                if (!infinite) return;
                var m = mod(p, n);
                if (m === p) return;
                p = m;
                setActive();
                position(false);
            }

            function showSection(i, dir) {
                sections.forEach(function (s, k) {
                    if (k === i) {
                        s.style.setProperty('--from', (dir * 48) + 'px');
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
                if (main) main.scrollTop = 0;
            }

            function goTo(target) {
                if (target === p) return;
                if (!infinite) { target = mod(target, n); if (target === p) return; }
                var dir = target > p ? 1 : -1;

                if (infinite && (itemIndex(target) < 1 || itemIndex(target) > items.length - 4)) {
                    var shift = p - mod(p, n);
                    p -= shift;
                    target -= shift;
                    setActive();
                    position(false);
                    void track.offsetWidth;
                }

                var oldIdx = mod(p, n);
                p = target;
                var newIdx = mod(p, n);

                if (newIdx !== oldIdx) showSection(newIdx, dir);
                setActive();
                position(true);

                clearTimeout(normTimer);
                normTimer = setTimeout(normalize, reduce.matches ? 0 : 400);
            }

            function onHeaderClick(e) {
                goTo(+e.currentTarget.getAttribute('data-pos'));
            }

            window.switchTab = function (index) {
                if (infinite) {
                    var delta = mod(index - mod(p, n), n);
                    if (delta > n / 2) delta -= n;
                    goTo(p + delta);
                } else {
                    goTo(index);
                }
            };

            /* GESTURE GESER (mobile): konten & header ikut jari */
            var sx = 0, sy = 0, st = 0, axis = null, tracking = false, baseX = 0;

            function curSection() { return sections[mod(p, n)]; }

            function onStart(e) {
                if (e.touches.length !== 1 || !mq.matches || !infinite) {
                    tracking = false;
                    return;
                }
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
                st = Date.now();
                axis = null;
                tracking = true;
            }

            function onMove(e) {
                if (!tracking) return;
                var dx = e.touches[0].clientX - sx;
                var dy = e.touches[0].clientY - sy;

                if (!axis) {
                    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                    if (Math.abs(dx) > Math.abs(dy) * 1.2) {
                        axis = 'x';
                        var it = items[itemIndex(p)];
                        baseX = it ? -it.offsetLeft : 0;
                        var s = curSection();
                        if (s) s.style.transition = 'none';
                        track.style.transition = 'none';
                    } else {
                        axis = 'y';
                    }
                }
                if (axis !== 'x') return;

                var sec = curSection();
                if (sec) {
                    sec.style.transform = 'translateX(' + dx + 'px)';
                    sec.style.opacity = String(1 - Math.min(Math.abs(dx) / (window.innerWidth * 1.4), 0.45));
                }
                track.style.transform = 'translateX(' + (baseX + dx * 0.35) + 'px)';
            }

            function resetSection(animated) {
                var s = curSection();
                if (!s) return;
                if (animated) {
                    s.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.25s';
                    s.style.transform = '';
                    s.style.opacity = '';
                    setTimeout(function () { s.style.transition = ''; }, 270);
                } else {
                    s.style.transition = '';
                    s.style.transform = '';
                    s.style.opacity = '';
                }
            }

            function onEnd(e, cancelled) {
                if (!tracking) return;
                tracking = false;
                if (axis !== 'x') return;
                var t = e.changedTouches[0];
                var dx = t.clientX - sx;
                var dt = Math.max(Date.now() - st, 1);
                var v = Math.abs(dx) / dt;
                var commit = !cancelled && (Math.abs(dx) > window.innerWidth * 0.25 ||
                    (Math.abs(dx) > 40 && v > 0.5));
                if (commit) {
                    resetSection(false);
                    goTo(p + (dx < 0 ? 1 : -1));
                } else {
                    resetSection(true);
                    position(true);
                }
            }

            [main, headerBar].forEach(function (el) {
                if (!el) return;
                el.addEventListener('touchstart', onStart, { passive: true });
                el.addEventListener('touchmove', onMove, { passive: true });
                el.addEventListener('touchend', function (e) { onEnd(e, false); }, { passive: true });
                el.addEventListener('touchcancel', function (e) { onEnd(e, true); }, { passive: true });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowRight') window.switchTab(mod(p, n) + 1);
                else if (e.key === 'ArrowLeft') window.switchTab(mod(p, n) - 1);
            });

            /* KEMBALI KE START */
            window.backToStartMenu = function () {
                if (leaving) return;
                leaving = true;
                var go = function () { window.location.href = 'index.html'; };
                if (mq.matches && !reduce.matches) {
                    document.body.classList.add('leaving');
                    setTimeout(go, 210);
                } else {
                    go();
                }
            };

            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    leaving = false;
                    document.body.classList.remove('leaving');
                }
            });

            /* Init */
            window.addEventListener('resize', function () { position(false); });
            if (mq.addEventListener) mq.addEventListener('change', build);
            build();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () { position(false); });
            }
        })();
    </script>
</body>
