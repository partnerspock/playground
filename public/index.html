    <script>
        "use strict";
        const byId = (id) => document.getElementById(id);
        // Sembunyikan lock screen sebelum halaman tampil kalau sudah pernah di-unlock (anti-berkedip)
        try {
            if (sessionStorage.getItem("ls_unlocked")) {
                document.documentElement.classList.add("ls-unlocked");
            }
        } catch (_) { }
        /* =========================================================
           Greeting tile
        ========================================================= */
        const greetingText = byId("tile-greeting-text");
        const greetingMessages = [
            ["Welcome", "everyone"],
            ["On my", "playground"],
            ["Just", "started"],
            ["Matthew", "6:13"]
        ];
        let greetingIndex = 0;

        if (greetingText) {
            setInterval(() => {
                greetingIndex = (greetingIndex + 1) % greetingMessages.length;

                greetingText.classList.add("tile-animate-out");

                setTimeout(() => {
                    greetingText.innerHTML =
                        `${greetingMessages[greetingIndex][0]}<br>${greetingMessages[greetingIndex][1]}`;

                    greetingText.classList.remove("tile-animate-out");
                    greetingText.classList.add("tile-animate-in");

                    setTimeout(() => {
                        greetingText.classList.remove("tile-animate-in");
                    }, 400);
                }, 350);
            }, 4500);
        }

        /* =========================================================
           Weather
        ========================================================= */
        async function fetchWeather() {
            const tempElement = byId("tile-weather-temp");
            const conditionElement = byId("tile-weather-condition");
            const iconElement = byId("tile-weather-icon");
            const cityElement = byId("tile-weather-city");
            const subtitleElement = byId("tile-weather-subtitle");
            const tagElement = byId("tile-weather-tag");

            if (!tempElement) return;

            try {
                const response = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current=temperature_2m,weather_code"
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!data.current) {
                    throw new Error("Data cuaca tidak tersedia.");
                }

                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;

                let condition = "Sunny";
                let icon = "☀️";

                if ([1, 2, 3].includes(code)) {
                    condition = "Cloudy";
                    icon = "⛅";
                } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                    condition = "Rain";
                    icon = "🌧️";
                } else if (code >= 95) {
                    condition = "Thunderstorm";
                    icon = "⚡";
                }

                tempElement.textContent = `${temp}°`;

                if (conditionElement) conditionElement.textContent = condition;
                if (iconElement) iconElement.textContent = icon;
                if (cityElement) cityElement.textContent = "Jakarta, Indonesia";
                if (subtitleElement) subtitleElement.textContent = "Today";
                if (tagElement) tagElement.textContent = "";
            } catch (error) {
                console.error("Gagal memuat cuaca:", error);

                tempElement.textContent = "--°";
                if (conditionElement) conditionElement.textContent = "Offline";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000);

        /* =========================================================
           Calendar tile
        ========================================================= */
        function updateCalendar(tileId) {
            const dayElement = byId(`${tileId}-day`);
            const dateElement = byId(`${tileId}-date`);
            const now = new Date();

            if (dayElement) {
                dayElement.textContent = now.toLocaleDateString("en-US", { weekday: "long" });
            }

            if (dateElement) {
                dateElement.textContent = now.getDate();
            }
        }

        updateCalendar("tile-calendar-greetings");

        /* =========================================================
           Music player
        ========================================================= */
        const backgroundMusic = byId("background-music");

        const playlist = [
            "assets/audio/foster.mp3",
            "assets/audio/above.mp3"
        ];

        let currentSongIndex = 0;
        let loadedSongIndex = -1;

        const musicControllers = [
            {
                button: byId("tile-music-main"),
                status: byId("tile-music-main-status"),
                icon: byId("tile-music-main-icon"),
                iconIdle: '<i class="fa-solid fa-play"></i>',
                iconPlaying: '<i class="fa-solid fa-pause"></i>',
                previous: byId("tile-music-main-prev"),
                next: byId("tile-music-main-next")
            }
        ];

        function setMusicUI(isPlaying, message = null) {
            musicControllers.forEach((controller) => {
                if (controller.status) {
                    controller.status.textContent = message || (isPlaying ? "PLAY" : "OFF");
                }

                if (controller.icon) {
                    controller.icon.innerHTML = isPlaying ? controller.iconPlaying : controller.iconIdle;
                }

                if (controller.button) {
                    controller.button.setAttribute("aria-label", isPlaying ? "Jeda musik" : "Putar musik");
                    controller.button.setAttribute("aria-pressed", String(isPlaying));
                }
            });
        }

        async function playCurrentSong() {
            if (!backgroundMusic || !playlist.length) return;

            try {
                if (loadedSongIndex !== currentSongIndex) {
                    backgroundMusic.src = playlist[currentSongIndex];
                    backgroundMusic.load();
                    loadedSongIndex = currentSongIndex;
                }

                await backgroundMusic.play();
                setMusicUI(true);
            } catch (error) {
                console.error("Musik gagal diputar:", error);

                loadedSongIndex = -1;
                setMusicUI(false, "CEK FILE");
            }
        }

        function changeSong(direction) {
            if (!playlist.length) return;

            currentSongIndex = (currentSongIndex + direction + playlist.length) % playlist.length;
            loadedSongIndex = -1;
            playCurrentSong();
        }

        musicControllers.forEach((controller) => {
            if (controller.button) {
                controller.button.addEventListener("click", () => {
                    if (!backgroundMusic) return;

                    if (backgroundMusic.paused) {
                        playCurrentSong();
                    } else {
                        backgroundMusic.pause();
                        setMusicUI(false);
                    }
                });
            }

            if (controller.previous) {
                controller.previous.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    changeSong(-1);
                });
            }

            if (controller.next) {
                controller.next.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    changeSong(1);
                });
            }
        });

        if (backgroundMusic) {
            backgroundMusic.removeAttribute("loop");

            backgroundMusic.addEventListener("playing", () => setMusicUI(true));

            backgroundMusic.addEventListener("pause", () => {
                if (!backgroundMusic.ended && !backgroundMusic.error) {
                    setMusicUI(false);

        const DT_DEFAULT_COLOR = "#008ed0";
        const DT_DEFAULT_ICON_SIZE = "32px";
        const DT_TRANSITION_MS = 300;

        class DynamicTile {
            constructor(tileId, slides, intervalMs = 5000) {
                this.tileId = tileId;
                this.slides = Array.isArray(slides) ? slides : [];
                this.intervalMs = intervalMs;

                this.index = 0;
                this.timer = null;
                this.transitionTimer = null;
                this.animationTimer = null;

                this.tile = byId(tileId);

                if (!this.tile) {
                    console.warn(`[DynamicTile] Markup '#${tileId}' tidak ditemukan.`);
                    return;
                }

                const part = (name) => byId(`${tileId}-${name}`);

                this.bg = part("bg");
                this.overlay = part("overlay");
                this.copy = part("copy");
                this.iconWrap = part("icon-wrap");
                this.tag = part("tag");
                this.text = part("text");

                const required = {
                    bg: this.bg,
                    overlay: this.overlay,
                    copy: this.copy,
                    "icon-wrap": this.iconWrap,
                    tag: this.tag,
                    text: this.text
                };

                const missing = Object.keys(required).filter((name) => !required[name]);

                if (missing.length) {
                    console.warn(
                        `[DynamicTile] '#${tileId}' kekurangan elemen: ` +
                        missing.map((name) => `${tileId}-${name}`).join(", ")
                    );
                    return;
                }

                if (!this.slides.length) {
                    console.warn(`[DynamicTile] '#${tileId}' tidak punya slide.`);
                    return;
                }

                this.caption = this.tile.querySelector(".tile-caption");

                if (!this.caption) {
                    this.caption = document.createElement("span");
                    this.caption.className = "tile-caption";
                    this.tile.appendChild(this.caption);
                }

                this.caption.setAttribute("aria-hidden", "true");

                this.render(this.slides[0]);
                this.start();
            }

            start() {
                if (this.timer || this.slides.length < 2) return;
                this.timer = setInterval(() => this.next(), this.intervalMs);
            }

            stop() {
                clearInterval(this.timer);
                clearTimeout(this.transitionTimer);
                clearTimeout(this.animationTimer);

                this.timer = null;
                this.transitionTimer = null;
                this.animationTimer = null;
            }

            render(slide) {
                if (!slide) return;

                const mode = slide.mode || "content";
                const align = slide.align || "left";

                this.tile.dataset.slideMode = mode;
                this.tile.dataset.slideAlign = mode === "icon" ? "center" : align;

                if (this.caption) {
                    const captionText = typeof slide.caption === "string" ? slide.caption.trim() : "";

                    this.caption.textContent = captionText;
                    this.caption.style.display = captionText ? "block" : "none";
                    this.caption.style.visibility = "visible";
                    this.caption.style.opacity = "1";
                }

                if (slide.image) {
                    this.bg.style.backgroundImage = `url("${slide.image}")`;
                    this.bg.style.backgroundColor = slide.color || "transparent";
                    this.bg.style.backgroundPosition = "center";
                    this.bg.style.backgroundSize = "cover";
                    this.bg.style.backgroundRepeat = "no-repeat";
                } else {
                    this.bg.style.backgroundImage = "none";
                    this.bg.style.backgroundColor = slide.color || DT_DEFAULT_COLOR;
                }

                const overlayOpacity = Math.min(1, Math.max(0, Number(slide.overlay) || 0));

                this.overlay.style.background = overlayOpacity > 0
                    ? `rgba(0, 0, 0, ${overlayOpacity})`
                    : "transparent";

                // Reset gaya inline dari render sebelumnya
                this.copy.style.display = "";
                this.copy.style.flexDirection = "";
                this.copy.style.alignItems = "";
                this.copy.style.justifyContent = "";
                this.copy.style.textAlign = "";
                this.copy.style.position = "";
                this.copy.style.inset = "";
                this.copy.style.width = "";
                this.copy.style.height = "";
                this.copy.style.padding = "";
                this.copy.style.margin = "";
                this.copy.style.gap = "";
                this.copy.style.zIndex = "";

                this.tile.style.backgroundColor = "";

                const showIcon =
                    mode !== "image" &&
                    typeof slide.icon === "string" &&
                    slide.icon.trim() !== "";

                this.iconWrap.replaceChildren();

                if (showIcon) {
                    const iconElement = document.createElement("i");

                    iconElement.className = slide.icon.trim();
                    iconElement.style.fontSize = slide.iconSize || DT_DEFAULT_ICON_SIZE;
                    iconElement.style.color = slide.iconColor || "#ffffff";
                    iconElement.style.lineHeight = "1";
                    iconElement.style.display = "inline-block";

                    this.iconWrap.appendChild(iconElement);

                    this.iconWrap.style.display = "flex";
                    this.iconWrap.style.alignItems = "center";
                    this.iconWrap.style.justifyContent =
                        mode === "icon" || align === "center" ? "center" : "flex-start";
                    this.iconWrap.style.width = "100%";
                    this.iconWrap.style.flexShrink = "0";

                    if (window.FontAwesome?.dom && typeof window.FontAwesome.dom.i2svg === "function") {
                        window.FontAwesome.dom.i2svg({ node: this.iconWrap });
                    }
                } else {
                    this.iconWrap.style.display = "none";
                    this.iconWrap.style.width = "";
                    this.iconWrap.style.flexShrink = "";
                    this.iconWrap.style.alignItems = "";
                    this.iconWrap.style.justifyContent = "";
                }

                if (mode === "image") {
                    this.tag.textContent = "";
                    this.tag.style.display = "none";

                    this.text.textContent = "";
                    this.text.style.display = "none";

                    return;
                }

                if (mode === "icon") {
                    this.copy.style.display = "flex";
                    this.copy.style.flexDirection = "column";
                    this.copy.style.alignItems = "center";
                    this.copy.style.justifyContent = "center";
                    this.copy.style.textAlign = "center";
                    this.copy.style.position = "absolute";
                    this.copy.style.inset = "0";
                    this.copy.style.width = "100%";
                    this.copy.style.height = "100%";
                    this.copy.style.padding = "0";
                    this.copy.style.margin = "0";
                    this.copy.style.gap = "0";
                    this.copy.style.zIndex = "3";

                    this.tag.textContent = "";
                    this.tag.style.display = "none";

                    this.text.textContent = "";
                    this.text.style.display = "none";

                    this.tile.style.backgroundColor = slide.color || DT_DEFAULT_COLOR;

                    return;
                }

                const showTag = mode === "content" && Boolean(slide.tag);
                const showText = mode === "content" && Boolean(slide.text);

                this.tag.textContent = showTag ? slide.tag : "";
                this.tag.style.display = showTag ? "" : "none";

                this.text.textContent = showText ? slide.text : "";
                this.text.style.display = showText ? "" : "none";

                if (mode === "content" && align === "center") {
                    this.copy.style.textAlign = "center";
                    this.tag.style.textAlign = "center";
                    this.text.style.textAlign = "center";
                } else {
                    this.copy.style.textAlign = "";
                    this.tag.style.textAlign = "";
                    this.text.style.textAlign = "";
                }
            }

            next() {
                if (this.slides.length < 2) return;

                const nextIndex = (this.index + 1) % this.slides.length;
                const nextSlide = this.slides[nextIndex];

                this.index = nextIndex;

                clearTimeout(this.transitionTimer);
                clearTimeout(this.animationTimer);

                this.copy.classList.remove("tile-animate-in", "tile-animate-out");
                this.copy.classList.add("tile-animate-out");

                this.transitionTimer = setTimeout(() => {
                    this.render(nextSlide);

                    this.copy.classList.remove("tile-animate-out");
                    this.copy.classList.add("tile-animate-in");

                    this.animationTimer = setTimeout(() => {
                        this.copy.classList.remove("tile-animate-in");
                    }, 400);
                }, DT_TRANSITION_MS);
            }
        }

        /* =========================================================

        ========================================================= */
        (function () {
            const SESSION_KEY = "ls_unlocked";
            const overlay = byId("lockscreen-overlay");
            const panel = byId("lockscreen-panel");
            const lsTime = byId("ls-time-display");
            const lsDate = byId("ls-date-display");

            if (!overlay || !panel) return;

            const DAYS = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const MONTHS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            // sessionStorage bisa error (mode private / diblokir), jadi dibungkus try/catch
            const store = {
                get() { try { return sessionStorage.getItem(SESSION_KEY); } catch (_) { return null; } },
                set() { try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (_) { } },
                clear() { try { sessionStorage.removeItem(SESSION_KEY); } catch (_) { } }
            };

            let lsClockTimer = null;
            let hideTimer = null;
            let wheelTimer = null;
            let rafId = null;
            let dragStartY = 0;
            let currentY = 0;
            let lastY = 0;
            let lastTime = 0;
            let velocityY = 0;
            let isDragging = false;
            let hasMoved = false;

            function updateLsClock() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, "0");
                const mm = String(now.getMinutes()).padStart(2, "0");

                if (lsTime) lsTime.textContent = `${hh}:${mm}`;
                if (lsDate) {
                    lsDate.textContent =
                        `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
                }
            }

            function startClock() {
                updateLsClock();
                clearInterval(lsClockTimer);
                lsClockTimer = setInterval(updateLsClock, 15000);
            }

            function stopClock() {
                clearInterval(lsClockTimer);
                lsClockTimer = null;
            }

            function dismissLockscreen(markSession = true, direction = null) {
                if (overlay.classList.contains("ls-hidden")) return;

                panel.classList.remove("ls-bounce");

                const h = window.innerHeight || 800;
                const remaining = Math.max(40, h - Math.abs(currentY));
                const duration = Math.max(0.18, Math.min(0.42, (remaining / h) * 0.9));
                const dir = direction !== null ? direction : (currentY >= 0 ? 1 : -1);

                panel.style.transition = `transform ${duration.toFixed(2)}s cubic-bezier(0.16, 1, 0.3, 1)`;
                panel.style.transform = `translateY(${dir * (h + 50)}px)`;

                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    overlay.classList.add("ls-hidden");
                    overlay.classList.remove("ls-dragging");
                    panel.style.transition = "";
                    panel.style.transform = "";
                    currentY = 0;
                    isDragging = false;
                    hasMoved = false;
                    stopClock();
                    if (markSession) store.set();
                }, duration * 1000 + 30);
            }

            function playBounce() {
                void panel.offsetWidth; // restart animasi
                panel.classList.add("ls-bounce");
                panel.addEventListener("animationend", () => {
                    panel.classList.remove("ls-bounce");
                }, { once: true });
            }

            function bounceLockscreen() {
                panel.classList.remove("ls-bounce");

                if (currentY !== 0) {
                    panel.style.transition = "transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1)";
                    panel.style.transform = "translateY(0)";
                    setTimeout(() => {
                        panel.style.transition = "";
                        currentY = 0;
                        playBounce();
                    }, 290);
                } else {
                    playBounce();
                }
            }

            /* ---------- Drag (Pointer Events: mouse + touch) ---------- */

            function onDown(e) {
                if (overlay.classList.contains("ls-hidden")) return;
                if (e.pointerType === "mouse" && e.button !== 0) return;

                clearTimeout(hideTimer);
                dragStartY = e.clientY;
                lastY = dragStartY;
                lastTime = performance.now();
                velocityY = 0;
                currentY = 0;
                isDragging = true;
                hasMoved = false;

                panel.style.transition = "none";
                overlay.classList.add("ls-dragging");

                try { overlay.setPointerCapture(e.pointerId); } catch (_) { }
            }

            function onMove(e) {
                if (!isDragging) return;

                const clientY = e.clientY;
                const now = performance.now();
                const dt = now - lastTime;

                if (dt > 10) {
                    velocityY = (clientY - lastY) / dt;
                    lastY = clientY;
                    lastTime = now;
                }

                currentY = clientY - dragStartY;
                if (Math.abs(currentY) > 5) hasMoved = true;

                if (!rafId) {
                    rafId = requestAnimationFrame(() => {
                        panel.style.transform = `translateY(${currentY}px)`;
                        rafId = null;
                    });
                }
            }

            function onUp(e) {
                if (!isDragging) return;

                isDragging = false;
                overlay.classList.remove("ls-dragging");

                try { overlay.releasePointerCapture(e.pointerId); } catch (_) { }

                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }

                const h = window.innerHeight || 800;
                const threshold = Math.min(100, Math.max(60, h * 0.12));

                const swipedUp = currentY < -threshold || (currentY < -30 && velocityY < -0.25);
                const swipedDown = currentY > threshold || (currentY > 30 && velocityY > 0.25);

                if (swipedUp) {
                    dismissLockscreen(true, -1);
                } else if (swipedDown) {
                    dismissLockscreen(true, 1);
                } else if (hasMoved) {
                    bounceLockscreen();
                }
            }

            overlay.addEventListener("pointerdown", onDown);
            overlay.addEventListener("pointermove", onMove);
            overlay.addEventListener("pointerup", onUp);
            overlay.addEventListener("pointercancel", onUp);

            overlay.addEventListener("click", () => {
                if (!hasMoved) bounceLockscreen();
                hasMoved = false;
            });

            /* ---------- Mouse wheel ---------- */

            overlay.addEventListener("wheel", (e) => {
                if (overlay.classList.contains("ls-hidden") || isDragging) return;
                e.preventDefault();

                hasMoved = true;
                panel.style.transition = "none";

                const h = window.innerHeight || 800;
                currentY = Math.max(-h, Math.min(h, currentY - e.deltaY));
                panel.style.transform = `translateY(${currentY}px)`;

                clearTimeout(wheelTimer);
                wheelTimer = setTimeout(() => {
                    const threshold = h * 0.2;
                    if (currentY < -threshold) dismissLockscreen(true, -1);
                    else if (currentY > threshold) dismissLockscreen(true, 1);
                    else bounceLockscreen();
                }, 100);
            }, { passive: false });

            /* ---------- Keyboard ---------- */

            document.addEventListener("keydown", (e) => {
                if (overlay.classList.contains("ls-hidden")) return;

                if (e.key === "Escape" || e.key === "ArrowUp" || e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    dismissLockscreen(true, -1);
                } else if (e.key === "ArrowDown") {
                    e.preventDefault();
                    dismissLockscreen(true, 1);
                }
            });

            /* ---------- API publik (dipakai tombol "Lock Screen") ---------- */

            window.showLockscreen = function () {
                clearTimeout(hideTimer);
                currentY = 0;
                isDragging = false;
                hasMoved = false;
                panel.style.transition = "";
                panel.style.transform = "translateY(0)";
                panel.classList.remove("ls-bounce");
                document.documentElement.classList.remove("ls-unlocked");
                overlay.classList.remove("ls-hidden", "ls-dragging");
                startClock();
                store.clear();
            };

            /* ---------- Init ---------- */

            if (store.get()) {
                overlay.classList.add("ls-hidden");
            } else {
                startClock();
            }
        })();

        /* home-mobile.js — efek khusus mobile (<= 640px). Dimuat di akhir <body>. */
        (function () {
            "use strict";
            const root = document.documentElement, body = document.body;
            const ws = document.querySelector(".workspace");
            const overlay = document.getElementById("lockscreen-overlay");
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            const mobile = matchMedia("(max-width: 640px)"); // efek hanya jalan di mobile

            const isLocked = () => !!overlay && !overlay.classList.contains("ls-hidden") && !root.classList.contains("ls-unlocked");
            const syncScrollLock = () => root.classList.toggle("ls-locked", isLocked());

            /* Animasi masuk tile: jalan saat pertama tampil & setiap habis unlock */
            document.querySelectorAll(".workspace .tile").forEach((t, i) => t.style.setProperty("--i", Math.min(i, 24)));
            let enterTimer;
            function playEnter() {
                if (reduce || !mobile.matches) return;
                clearTimeout(enterTimer);
                body.classList.remove("start-enter");
                void body.offsetWidth;
                body.classList.add("start-enter");
                enterTimer = setTimeout(() => body.classList.remove("start-enter"), 1800);
            }

            let wasLocked = isLocked();
            syncScrollLock();
            if (!wasLocked) playEnter();
            if (overlay) {
                new MutationObserver(() => {
                    const now = isLocked();
                    syncScrollLock();
                    if (wasLocked && !now) { window.scrollTo(0, 0); playEnter(); }
                    wasLocked = now;
                }).observe(overlay, { attributes: true, attributeFilter: ["class"] });
            }

            /* Efek tekan: tile miring ke arah titik sentuh */
            if (ws) {
                let cur = null, timer = 0, sx = 0, sy = 0;
                const release = () => {
                    clearTimeout(timer);
                    if (!cur) return;
                    cur.classList.remove("pressed");
                    cur.style.removeProperty("--rx");
                    cur.style.removeProperty("--ry");
                    cur = null;
                };
                ws.addEventListener("pointerdown", (e) => {
                    if (!mobile.matches) return;
                    if (e.pointerType === "mouse" && e.button !== 0) return;
                    const t = e.target.closest(".tile");
                    if (!t) return;

                    // jeda singkat agar tidak "berkedip" saat jari mulai scroll
                    timer = setTimeout(() => {

                        const nx = ((sx - r.left) / r.width - .5) * 2;
                        const ny = ((sy - r.top) / r.height - .5) * 2;
                        const max = r.width > 150 ? 5 : 9;
                        t.style.setProperty("--ry", (nx * max).toFixed(1) + "deg");
                        t.style.setProperty("--rx", (-ny * max).toFixed(1) + "deg");
                        t.classList.add("pressed");
                        cur = t;
                    }, e.pointerType === "touch" ? 70 : 0);
                });
                ws.addEventListener("pointermove", (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) release(); });
                ["pointerup", "pointercancel", "pointerleave"].forEach((n) =>
                    ws.addEventListener(n, () => { clearTimeout(timer); setTimeout(release, 90); }));
            }

        })();
        /* applist.js: App list ala Windows Phone (mobile <= 640px).
   - Tombol panah di bawah homescreen, atau geser jari ke KIRI -> buka list.
   - Geser jari ke KANAN, tombol "start", atau tombol back HP -> kembali ke homescreen.
   - Tap huruf -> jump list abjad.
   Dimuat dengan <script defer> setelah markup #applist ada. */
        (function () {
            "use strict";

            var root = document.documentElement;
            var list = document.getElementById("applist");
            var scroller = document.getElementById("al-scroll");
            var jump = document.getElementById("al-jump");
            var openBtn = document.getElementById("al-open");
            var backBtn = document.getElementById("al-back");
            if (!list || !scroller || !jump) return;

            var mobile = window.matchMedia("(max-width: 640px)");
            var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

            /* ---------------------------------------------------------
               Daftar app. Tambah / ubah di sini; urutan abjad otomatis.
               run: fungsi navigasi yang sudah ada di index.html,
                    atau klik tile link (telepon, email, dst.) lewat selector.
            --------------------------------------------------------- */
            function call(name) {
                return function () { if (typeof window[name] === "function") window[name](); };
            }
            function link(selector) {
                return function () {
                    var a = document.querySelector(selector);
                    if (a) a.click();
                };
            }

            var APPS = [
                { name: "About", icon: "fa-solid fa-info", color: "#008ed0", run: call("openAbout") },
                { name: "Augmented Reality", icon: "fa-brands fa-unity", color: "#FF007F", run: call("openAr26") },
                { name: "Calendar", icon: "fa-solid fa-calendar-days", color: "#5b53f5", run: call("openCalendar") },
                { name: "Certificate", icon: "fa-solid fa-trophy", color: "#7e3878", run: call("openCertificate") },
                { name: "Education", icon: "fa-solid fa-graduation-cap", color: "#ad2f4b", run: call("openEducation") },
                { name: "Everyday", icon: "fa-brands fa-accusoft", color: "#291C0F", run: call("openEveryday") },
                { name: "Experience", icon: "fa-solid fa-briefcase", color: "#008ed0", run: call("openExperience") },
                { name: "Happay", icon: "fa-solid fa-bars-staggered", color: "#443bc7", run: call("openHappay") },
                { name: "LinkedIn", icon: "fa-brands fa-linkedin", color: "#0078d7", run: link('a[href*="linkedin.com"]') },
                {
                    name: "Lock Screen", icon: "fa-solid fa-lock", color: "#008ed0",
                    run: function () {
                        closeList(true); // tutup tanpa animasi dulu, baru kunci
                        if (typeof window.showLockscreen === "function") window.showLockscreen();
                    }
                },
                { name: "Mail", icon: "fa-solid fa-envelope", color: "#008ed0", run: link('a[href^="mailto:"]') },
                { name: "Maps", icon: "fa-solid fa-map", color: "#008ed0", run: call("openMap") },
                { name: "Phone", icon: "fa-solid fa-phone", color: "#008ed0", run: link('a[href^="tel:"]') },
                { name: "Portfolio", icon: "fa-solid fa-cubes-stacked", color: "#008ed0", run: link('a[title="Portfolio"]') },
                { name: "Profile", icon: "fa-solid fa-circle-user", color: "#00a4ef", run: call("openProfile") },
                { name: "Project Showcases", icon: "fa-solid fa-shop", color: "#00bcf2", run: call("openShowcase") },
                { name: "Ticketing", icon: "fa-solid fa-ticket", color: "#5ec26a", run: call("openTicketing25") },
                { name: "WhatsApp", icon: "fa-brands fa-whatsapp", color: "#107c10", run: link('a[href*="wa.me"]') }
            ];

            /* ---------------------------------------------------------
               Bangun list
            --------------------------------------------------------- */
            function el(tag, cls, text) {
                var n = document.createElement(tag);
                if (cls) n.className = cls;
                if (text != null) n.textContent = text;
                return n;
            }

            function letterOf(name) {
                var c = name.trim().charAt(0).toUpperCase();
                return /[A-Z]/.test(c) ? c : "#";
            }

            function makeRow(app) {
                var b = el("button", "al-row");
                b.type = "button";
                var ico = el("span", "al-ico");
                ico.style.setProperty("--c", app.color);
                ico.appendChild(el("i", app.icon));
                b.appendChild(ico);
                b.appendChild(el("span", "al-name", app.name));
                b.addEventListener("click", app.run);
                return b;
            }

            var groups = {};
            var order = [];

            APPS.sort(function (a, b) {
                return a.name.localeCompare(b.name, "en", { sensitivity: "base" });
            });

            APPS.forEach(function (app) {
                var L = letterOf(app.name);
                if (!groups[L]) {
                    var g = el("section", "al-group");
                    var h = el("button", "al-letter", L);
                    h.type = "button";
                    h.setAttribute("aria-label", "Lompat ke huruf lain");
                    g.appendChild(h);
                    groups[L] = g;
                    order.push(L);
                    scroller.appendChild(g);
                }
                groups[L].appendChild(makeRow(app));
            });

            var jgrid = el("div", "al-jgrid");
            "#ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function (L) {
                var b = el("button", "al-jcell", L);
                b.type = "button";
                if (!groups[L]) {
                    b.disabled = true;
                } else {
                    b.addEventListener("click", function () {
                        closeJump();
                        scroller.scrollTop = Math.max(0, groups[L].offsetTop - 8);
                    });
                }
                jgrid.appendChild(b);
            });
            jump.appendChild(jgrid);

            function refreshIcons() {
                try {
                    if (window.FontAwesome && window.FontAwesome.dom && typeof window.FontAwesome.dom.i2svg === "function") {
                        window.FontAwesome.dom.i2svg({ node: list });
                    }
                } catch (_) { }
            }
            refreshIcons();
            window.addEventListener("load", refreshIcons);

            /* ---------------------------------------------------------
               Jump list
            --------------------------------------------------------- */
            function openJump() { jump.classList.add("open"); }
            function closeJump() { jump.classList.remove("open"); }

            scroller.addEventListener("click", function (e) {
                if (e.target.closest(".al-letter")) openJump();
            });
            jump.addEventListener("click", function (e) {
                if (!e.target.closest(".al-jcell")) closeJump();
            });

            /* ---------------------------------------------------------
               Buka / tutup (p = progres 0..1, dipakai CSS lewat --alp)
            --------------------------------------------------------- */
            var open = false;
            var p = 0;
            var anim = null;
            var dragging = false;
            var pushed = false;
            var skipPop = 0;

            function setP(v) {
                p = v;
                root.style.setProperty("--alp", v.toFixed(3));
            }

            function settle(toOpen, instant) {
                clearTimeout(anim);
                open = toOpen;
                root.classList.toggle("al-open", toOpen);
                list.setAttribute("aria-hidden", String(!toOpen));
                if (toOpen) root.classList.add("al-active");
                else closeJump();

                if (instant || reduce.matches) {
                    root.classList.add("al-drag"); // matikan transisi sesaat
                    setP(toOpen ? 1 : 0);
                    void list.offsetWidth;
                    root.classList.remove("al-drag");
                    if (!toOpen) root.classList.remove("al-active");
                } else {
                    root.classList.remove("al-drag");
                    setP(toOpen ? 1 : 0);
                    if (!toOpen) {
                        anim = setTimeout(function () {
                            if (!open && !dragging) root.classList.remove("al-active");
                        }, 360);
                    }
                }
            }

            function openList() {
                if (open) return;
                settle(true);
                if (!pushed) {
                    try { history.pushState({ al: 1 }, ""); pushed = true; } catch (_) { }
                }
            }

            function closeList(instant) {
                if (!open) return;
                settle(false, instant);
                if (pushed) {
                    pushed = false;
                    if (history.state && history.state.al) {
                        skipPop++;
                        history.back();
                    }
                }
            }

            // Tombol back HP: tutup list (bukan keluar halaman)
            window.addEventListener("popstate", function () {
                if (skipPop > 0) { skipPop--; return; }
                if (open) { pushed = false; settle(false); }
            });

            if (openBtn) openBtn.addEventListener("click", openList);
            if (backBtn) backBtn.addEventListener("click", function () { closeList(); });

            document.addEventListener("keydown", function (e) {
                if (e.key !== "Escape") return;
                if (jump.classList.contains("open")) closeJump();
                else closeList();
            });

            function onMediaChange() {
                if (!mobile.matches && (open || root.classList.contains("al-active"))) {
                    pushed = false;
                    settle(false, true);
                }
            }
            if (mobile.addEventListener) mobile.addEventListener("change", onMediaChange);

            /* ---------------------------------------------------------
               Gesture geser: jari ke KIRI = buka, jari ke KANAN = tutup
            --------------------------------------------------------- */
            var tracking = false;
            var axis = null;
            var sx = 0, sy = 0, st = 0, W = 360;
            var suppressUntil = 0;

            function lockScreenShown() {
                var o = document.getElementById("lockscreen-overlay");
                return !!o && !o.classList.contains("ls-hidden") && !root.classList.contains("ls-unlocked");
            }

            document.addEventListener("pointerdown", function (e) {
                if (!mobile.matches || lockScreenShown() || jump.classList.contains("open")) return;
                if (!e.isPrimary) return;
                if (e.pointerType === "mouse" && e.button !== 0) return;
                tracking = true;
                axis = null;
                sx = e.clientX;
                sy = e.clientY;
                st = performance.now();
                W = window.innerWidth || 360;
            });

            document.addEventListener("pointermove", function (e) {
                if (!tracking) return;
                var dx = e.clientX - sx;
                var dy = e.clientY - sy;

                if (axis === null) {
                    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
                    var horizontal = Math.abs(dx) > Math.abs(dy) * 1.3;
                    var rightWay = open ? dx > 0 : dx < 0;
                    if (!horizontal || !rightWay) { tracking = false; return; } // scroll vertikal biasa
                    axis = "x";
                    dragging = true;
                    clearTimeout(anim);
                    root.classList.add("al-active", "al-drag");
                }

                var v = open ? 1 - dx / W : -dx / W;
                setP(Math.min(1, Math.max(0, v)));
            }, { passive: true });

            function endDrag(e) {
                if (!tracking) return;
                tracking = false;
                if (axis !== "x") return;

                dragging = false;
                suppressUntil = Date.now() + 350; // cegah klik tile yang tidak disengaja
                root.classList.remove("al-drag");

                var dx = e.clientX - sx;
                var dt = Math.max(performance.now() - st, 1);
                var fast = Math.abs(dx) / dt > 0.5 && Math.abs(dx) > 40;
                var cancelled = e.type === "pointercancel";

                var toOpen;
                if (cancelled) toOpen = open;
                else if (open) toOpen = !(p < 0.65 || (fast && dx > 0));
                else toOpen = p > 0.35 || (fast && dx < 0);

                if (toOpen) { if (open) settle(true); else openList(); }
                else { if (open) closeList(); else settle(false); }
            }

            document.addEventListener("pointerup", endDrag);
            document.addEventListener("pointercancel", endDrag);

            document.addEventListener("click", function (e) {
                if (Date.now() < suppressUntil) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            window.addEventListener("pageshow", function (e) {
                if (e.persisted) suppressUntil = 0;
            });
        })();
    </script>
</body>

</html>
